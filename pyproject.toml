[project]
name = "vobot-now-playing"
version = "1.0.0"
description = "Displays the currently playing media from Windows media notifications on a Vobot Mini Dock."
requires-python = ">=3.13,<3.14"
dependencies = [
    "coloredlogs~=15.0.1",
    "PyQt5-Qt5==5.15.2",
    "PyQt5==5.15.11",
    "winrt-runtime>=3.2.1",
    "winrt-windows.media.control>=3.2.1",
    "winrt-windows.foundation>=3.2.1",
    "winrt-windows.foundation.collections>=3.2.1",
    "winrt-windows.storage",
    "winrt-windows.storage.streams",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "micropython-esp32-stubs==1.27.0.post1",
    "ipython==9.16.1",
    "pyinstaller==6.22.0",
    "pyinstaller-hooks-contrib==2026.6",
    "pyserial==3.5",
    "ruff==0.16.3"
]

[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    ".claude/*",
    "esp32/*",
    "tools/pyboard.py",   # vendored from MicroPython, left unmodified
    "ui/Ui_*.py",         # pyuic5-generated, do not edit manually
]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "single"
